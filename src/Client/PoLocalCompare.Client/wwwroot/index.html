<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Duel Arena</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="_content/Radzen.Blazor/css/dark.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PoLocalCompare.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="boot-timeout-ui" hidden style="max-width: 720px; margin: 1rem auto; padding: 1rem; border: 1px solid #5f1f1f; background: #1b0f0f; color: #ffdada; border-radius: 8px; font-family: ui-sans-serif, system-ui, sans-serif;">
        <h2 style="margin: 0 0 0.5rem; font-size: 1rem;">Client startup is taking longer than expected</h2>
        <p id="boot-timeout-message" style="margin: 0 0 0.75rem; line-height: 1.4;">
            The app is still loading. If this persists, check the diagnostics page and refresh.
        </p>
        <p style="margin: 0;">
            <a href="/diag" style="color: #93c5fd;">Open diagnostics</a>
            <span style="opacity: 0.6;"> · </span>
            <a href="/" style="color: #93c5fd;">Retry</a>
        </p>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (() => {
            const timeoutUi = document.getElementById("boot-timeout-ui");
            const timeoutMessage = document.getElementById("boot-timeout-message");
            const app = document.getElementById("app");
            const timeoutMs = 10000;

            const showFallback = (message) => {
                if (!timeoutUi || timeoutUi.hidden === false) {
                    return;
                }
                timeoutMessage.textContent = message;
                timeoutUi.hidden = false;
            };

            const hideFallback = () => {
                if (timeoutUi) {
                    timeoutUi.hidden = true;
                }
            };

            const timer = setTimeout(() => {
                showFallback("The app is still loading after 10 seconds. This usually means a client runtime asset failed to load.");
            }, timeoutMs);

            window.__clearBootTimeout = () => {
                clearTimeout(timer);
                hideFallback();
            };

            if (app) {
                const observer = new MutationObserver(() => {
                    if (!app.querySelector(".loading-progress")) {
                        window.__clearBootTimeout();
                        observer.disconnect();
                    }
                });
                observer.observe(app, { childList: true, subtree: true });
            }

            window.addEventListener("error", (event) => {
                if ((event.filename || "").includes("blazor.webassembly")) {
                    showFallback("Client runtime failed to load. Verify _framework assets and refresh.");
                }
            });
        })();
    </script>
    <script>
        (() => {
            const importMapScript = document.querySelector('script[type="importmap"]');
            let bootstrapSrc = "_framework/blazor.webassembly.js";

            if (importMapScript?.textContent) {
                try {
                    const importMap = JSON.parse(importMapScript.textContent);
                    bootstrapSrc = importMap.imports?.["./_framework/blazor.webassembly.js"] ?? bootstrapSrc;
                } catch {
                    // Keep default path when import map parsing fails.
                }
            }

            if (bootstrapSrc.startsWith("./")) {
                bootstrapSrc = bootstrapSrc.substring(2);
            }

            const script = document.createElement("script");
            script.src = bootstrapSrc;
            script.onload = () => window.__clearBootTimeout && window.__clearBootTimeout();
            script.onerror = () => {
                const timeoutUi = document.getElementById("boot-timeout-ui");
                if (timeoutUi) {
                    timeoutUi.hidden = false;
                }
            };
            document.body.appendChild(script);
        })();
    </script>
    <script src="/js/webllm-interop.js?v=2"></script>
    <script src="/js/diag-interop.js?v=3"></script>
    <script src="/js/util.js?v=2"></script>
</body>

</html>
