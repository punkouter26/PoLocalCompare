services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: polocalcompare-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"   # Blob
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data

volumes:
  azurite-data:
