name: Deploy PoLocalCompare to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  AZURE_LOCATION: westus2
  AZURE_RESOURCE_GROUP: PoLocalCompare
  AZURE_SHARED_RESOURCE_GROUP: PoShared
  AZURE_APP_SERVICE_PLAN_NAME: asp-poshared-linux
  AZURE_APP_INSIGHTS_NAME: poappideinsights8f9c9a4e
  AZURE_KEY_VAULT_NAME: kv-poshared
  AZURE_ENVIRONMENT_NAME: dev
  DEPLOYMENT_NAME: polocalcompare-infra
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore WebAssembly workload
        run: dotnet workload restore PoLocalCompare.slnx

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PoLocalCompare.slnx

      - name: Build
        run: dotnet build PoLocalCompare.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/unit/PoLocalCompare.Unit.Tests/PoLocalCompare.Unit.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/integration/PoLocalCompare.Integration.Tests/PoLocalCompare.Integration.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ env.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --output none

      - name: Preview infrastructure changes
        run: |
          az deployment group what-if \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ env.AZURE_ENVIRONMENT_NAME }}" \
                         sharedResourceGroupName="${{ env.AZURE_SHARED_RESOURCE_GROUP }}" \
                         sharedAppServicePlanName="${{ env.AZURE_APP_SERVICE_PLAN_NAME }}" \
                         sharedAppInsightsName="${{ env.AZURE_APP_INSIGHTS_NAME }}" \
            --validation-level Provider

      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters environmentName="${{ env.AZURE_ENVIRONMENT_NAME }}" \
                         sharedResourceGroupName="${{ env.AZURE_SHARED_RESOURCE_GROUP }}" \
                         sharedAppServicePlanName="${{ env.AZURE_APP_SERVICE_PLAN_NAME }}" \
                         sharedAppInsightsName="${{ env.AZURE_APP_INSIGHTS_NAME }}" \
            --output none

      - name: Read deployment outputs
        id: deploy_outputs
        run: |
          appServiceName=$(az deployment group show \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.outputs.appServiceName.value" \
            -o tsv)
          appServiceUrl=$(az deployment group show \
            --name "${{ env.DEPLOYMENT_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.outputs.appServiceUrl.value" \
            -o tsv)
          echo "app_service_name=$appServiceName" >> "$GITHUB_OUTPUT"
          echo "app_service_url=$appServiceUrl" >> "$GITHUB_OUTPUT"

      - name: Grant Key Vault access to the app identity
        run: |
          principalId=$(az webapp identity show \
            --name "${{ steps.deploy_outputs.outputs.app_service_name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query principalId \
            -o tsv)
          az keyvault set-policy \
            --name "${{ env.AZURE_KEY_VAULT_NAME }}" \
            --object-id "$principalId" \
            --secret-permissions get list \
            --output none

      - name: Publish application
        run: |
          dotnet publish src/PoLocalCompare.Api/PoLocalCompare.Api.csproj \
            --configuration Release \
            --output ./artifacts/publish

          if [ ! -f ./artifacts/publish/PoLocalCompare.Api.dll ]; then
            echo "::error::Publish output missing PoLocalCompare.Api.dll"
            ls -la ./artifacts/publish
            exit 1
          fi

          cd ./artifacts/publish
          zip -r ../webapp.zip .

      - name: Validate deployment artifact
        run: |
          if [ ! -f ./artifacts/webapp.zip ]; then
            echo "::error::Deployment artifact not found: ./artifacts/webapp.zip"
            exit 1
          fi

          zipSizeMb=$(du -m ./artifacts/webapp.zip | cut -f1)
          echo "Artifact size: ${zipSizeMb} MB"

          unzip -l ./artifacts/webapp.zip | head -n 40
          if ! unzip -l ./artifacts/webapp.zip | grep -q "PoLocalCompare.Api.dll"; then
            echo "::error::webapp.zip does not contain PoLocalCompare.Api.dll"
            exit 1
          fi

      - name: Start App Service
        run: |
          az webapp start \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.deploy_outputs.outputs.app_service_name }}"

      - name: Deploy application package
        run: |
          az webapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.deploy_outputs.outputs.app_service_name }}" \
            --src-path ./artifacts/webapp.zip \
            --type zip \
            --clean true \
            --async true

      - name: Verify deployment health
        run: |
          appUrl="${{ steps.deploy_outputs.outputs.app_service_url }}"
          echo "Waiting for site to become healthy at $appUrl/health ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$appUrl/health" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site did not become healthy within 5 minutes"
          exit 1

      - name: Capture deployment diagnostics on failure
        if: failure()
        run: |
          az webapp log download \
            --name "${{ steps.deploy_outputs.outputs.app_service_name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --log-file appservice-logs.zip || true
          echo "Downloaded appservice-logs.zip (if available)"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource Group | ${{ env.AZURE_RESOURCE_GROUP }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shared App Service Plan | ${{ env.AZURE_APP_SERVICE_PLAN_NAME }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| App Service | ${{ steps.deploy_outputs.outputs.app_service_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy_outputs.outputs.app_service_url }} |" >> "$GITHUB_STEP_SUMMARY"