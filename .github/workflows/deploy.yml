name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: app-polocalcompare-win
  AZURE_RESOURCE_GROUP: PoLocalCompare
  API_PROJECT_PATH: src/PoLocalCompare.Api/PoLocalCompare.Api.csproj

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet workload restore ${{ env.API_PROJECT_PATH }}

      # Pure logic, no Docker. Kept first so a logic break fails in seconds rather than
      # after a container pull.
      - name: Unit
        run: dotnet test tests/PoLocalCompare.Unit -c Release --logger "trx;LogFileName=unit.trx"

      # Both of these spin Azurite via Testcontainers; the ubuntu runner ships a Docker daemon.
      - name: Integration
        run: dotnet test tests/PoLocalCompare.Integration -c Release --logger "trx;LogFileName=integration.trx"

      - name: E2E API
        run: dotnet test tests/PoLocalCompare.E2EAPI -c Release --logger "trx;LogFileName=e2eapi.trx"

      # PoLocalCompare.E2EUI is deliberately NOT run here: it drives a real headed Chrome
      # against a running instance and exercises WebGPU paths a runner has no GPU for.
      # Run it locally after touching UI markup — see AGENT.MD §8.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      # lfs: the vendored web-llm.js bundle is an LFS object and gets published into wwwroot.
      # Without this the runner checks out the ~130-byte pointer file instead and every browser
      # model fails at import time in the deployed app.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet workload restore ${{ env.API_PROJECT_PATH }}
      # publish implies restore + build — no separate steps needed.
      - run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      # Checkout is required so the infra template is available to the deploy step.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Ensure the App Service exists before pushing code. Steady-state: skip (the CI identity
      # is scoped to this RG and cannot re-assign the cross-RG shared managed identity, so a
      # full bicep converge would fail on an already-provisioned site). If the site is missing,
      # attempt to recreate it from the template — recovery requires the deploy principal to
      # hold 'Managed Identity Operator' on PoShared/mi-poshared-containerapps.
      - name: Ensure infrastructure
        run: |
          if az webapp show -n "$AZURE_WEBAPP_NAME" -g "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "App Service '$AZURE_WEBAPP_NAME' already exists — skipping provisioning."
          else
            echo "App Service '$AZURE_WEBAPP_NAME' not found — provisioning from infra/main.bicep."
            az deployment group create \
              -g "$AZURE_RESOURCE_GROUP" \
              -n "provision-${{ github.sha }}" \
              --template-file infra/main.bicep
          fi
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      - name: Verify deployment (health + SPA mount)
        run: |
          base="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          sleep 30
          ok=0
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$base/health" --max-time 30 || echo "000")
            echo "Health check $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then echo "::error::/health never returned 200"; exit 1; fi
          # SPA mount guard — catches trimmed/broken WASM publishes that /health can't see.
          ROOT=$(curl -s "$base/" --max-time 30)
          echo "$ROOT" | grep -q "blazor.webassembly.js" || { echo "::error::index.html is missing the Blazor bootstrap"; exit 1; }
          BOOT=$(curl -s -o /dev/null -w "%{http_code}" "$base/_framework/blazor.webassembly.js" --max-time 30 || echo "000")
          echo "Blazor bootstrap asset: HTTP $BOOT"
          [ "$BOOT" = "200" ] || { echo "::error::Blazor framework assets are not being served"; exit 1; }
          echo "Deployment verified: health + SPA assets OK."
