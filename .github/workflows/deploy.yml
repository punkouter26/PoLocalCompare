name: Deploy PoLocalCompare to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  AZURE_RESOURCE_GROUP: PoLocalCompare
  AZURE_WEBAPP_NAME: polocalcompare-appservice-dev
  AZURE_WEBAPP_URL: https://polocalcompare-appservice-dev.azurewebsites.net
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore WebAssembly workload
        run: dotnet workload restore PoLocalCompare.slnx

      - name: Restore
        run: dotnet restore PoLocalCompare.slnx

      - name: Build
        run: dotnet build PoLocalCompare.slnx --configuration Release --no-restore

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Publish application
        run: |
          dotnet publish src/PoLocalCompare.Api/PoLocalCompare.Api.csproj \
            --configuration Release \
            --output ./artifacts/publish

          if [ ! -f ./artifacts/publish/PoLocalCompare.Api.dll ]; then
            echo "::error::Publish output missing PoLocalCompare.Api.dll"
            ls -la ./artifacts/publish
            exit 1
          fi

          cd ./artifacts/publish
          zip -r ../webapp.zip .

      - name: Validate deployment artifact
        run: |
          if [ ! -f ./artifacts/webapp.zip ]; then
            echo "::error::Deployment artifact not found: ./artifacts/webapp.zip"
            exit 1
          fi

          zipSizeMb=$(du -m ./artifacts/webapp.zip | cut -f1)
          echo "Artifact size: ${zipSizeMb} MB"

          unzip -l ./artifacts/webapp.zip | head -n 40
          if ! unzip -l ./artifacts/webapp.zip | grep -q "PoLocalCompare.Api.dll"; then
            echo "::error::webapp.zip does not contain PoLocalCompare.Api.dll"
            exit 1
          fi

      - name: Start App Service
        run: |
          az webapp start \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}"

      - name: Enforce App Service startup/deploy settings
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITES_PORT=8080 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=1800 \
            --output none

      - name: Deploy application package
        run: |
          az webapp deploy \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src-path ./artifacts/webapp.zip \
            --type zip \
            --clean true \
            --track-status false

      - name: Verify deployment health
        run: |
          appUrl="${{ env.AZURE_WEBAPP_URL }}"
          echo "Waiting for site to become healthy at $appUrl/health ..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$appUrl/health" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is healthy."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Site did not become healthy within 10 minutes"
          exit 1

      - name: Capture deployment diagnostics on failure
        if: failure()
        run: |
          az webapp log download \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --log-file appservice-logs.zip || true
          echo "Downloaded appservice-logs.zip (if available)"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource Group | ${{ env.AZURE_RESOURCE_GROUP }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| App Service | ${{ env.AZURE_WEBAPP_NAME }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ env.AZURE_WEBAPP_URL }} |" >> "$GITHUB_STEP_SUMMARY"